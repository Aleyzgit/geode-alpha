name: Alpha Windows launcher

on:
  push:
    paths:
      - 'installer/windows/*Alpha*.ps1'
      - 'cmake/AlphaBindingAudit.cmake'
      - 'cmake/tests/AlphaBindingAudit.cmake'
      - '.github/workflows/alpha-launcher.yml'
  pull_request:
    paths:
      - 'installer/windows/*Alpha*.ps1'
      - 'cmake/AlphaBindingAudit.cmake'
      - 'cmake/tests/AlphaBindingAudit.cmake'
      - '.github/workflows/alpha-launcher.yml'

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native binding audit fixtures
        run: cmake -P cmake/tests/AlphaBindingAudit.cmake
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          ./installer/windows/Test-AlphaLauncher.ps1
          ./installer/windows/Test-AlphaModRepairs.ps1
          ./installer/windows/Test-AlphaProfileImport.ps1
      - name: PowerShell 7
        shell: pwsh
        run: |
          ./installer/windows/Test-AlphaLauncher.ps1
          ./installer/windows/Test-AlphaModRepairs.ps1
          ./installer/windows/Test-AlphaProfileImport.ps1
